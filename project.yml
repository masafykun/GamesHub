name: GamesHub
options:
  bundleIdPrefix: com.gameshub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.5"
settings:
  SWIFT_VERSION: 5.9
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 1
targets:
  GamesHub:
    type: application
    platform: iOS
    sources:
      - path: GamesHub
    info:
      path: GamesHub/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: GamesHub
        # Info.plist を自前で持つ構成では、Xcode が CFBundleIconName を
        # 入れてくれないので明示する。これが無いとアイコンが出ない
        CFBundleIconName: AppIcon
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: GamesHub/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.gameshub.GamesHub
